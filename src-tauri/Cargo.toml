[package]
name = "chat-memory-tree"
version = "0.1.0"
description = "Local-first knowledge tree for saved chats, with deterministic rule-based briefs"
authors = ["Chat Memory Tree"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chat_memory_tree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
strawberry-core = { path = "../strawberry-core" }
tauri = { version = "2", features = [] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = "1"
keyring = "3"
notify = "7"
image = "0.25"
xcap = { version = "0.9", default-features = false, features = ["image"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
