[package]
name = "chat-memory-tree"
version = "0.1.0"
description = "Local-first knowledge tree for saved chats, with deterministic rule-based briefs"
authors = ["Chat Memory Tree"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chat_memory_tree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
