[package]
name = "strawberry-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Deterministic, offline chat compression core: extraction rules + AI-to-AI handoff packets"

[lib]
name = "strawberry_core"
path = "src/lib.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
