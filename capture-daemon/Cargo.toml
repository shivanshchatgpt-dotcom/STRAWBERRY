[package]
name = "strawberry-capture-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
